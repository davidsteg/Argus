; Runs all three Argus processes (equities engine, crypto engine, dashboard)
; inside one container. Each keeps its own restart policy so a crash in one
; engine doesn't take the others down — the closest single-container
; equivalent of the old per-service `restart: unless-stopped` containers.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:equities-backend]
command=python bot.py
directory=/app/backend
environment=API_PORT="8000",DB_PATH="/app/shared/argus_state.db"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:crypto-backend]
command=python bot.py
directory=/app/backend
environment=MARKET="crypto",API_PORT="8001",DB_PATH="/app/shared/argus_crypto.db"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=python app.py
directory=/app/frontend
environment=DB_PATH="/app/shared/argus_state.db",CRYPTO_DB_PATH="/app/shared/argus_crypto.db",BACKEND_API_URL="http://127.0.0.1:8000",CRYPTO_BACKEND_API_URL="http://127.0.0.1:8001"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
