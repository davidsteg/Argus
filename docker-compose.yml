# Runs the published Docker Hub image (built by CI on every version tag).
# Update: docker compose pull && docker compose up -d
# Local development from source instead:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# One container runs all three processes (equities engine, crypto engine,
# dashboard) under supervisord — see Dockerfile / deploy/supervisord.conf.
services:
  argus:
    image: davidsteg/argus:${ARGUS_VERSION:-latest}
    container_name: argus
    restart: unless-stopped
    environment:
      - TZ=Europe/Zurich
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SENTIMENT_MODEL=${SENTIMENT_MODEL:-claude-opus-4-8}
      - ANALYST_OLLAMA_BASE_URL=${ANALYST_OLLAMA_BASE_URL:-}
      - ANALYST_OLLAMA_API_KEY=${ANALYST_OLLAMA_API_KEY:-}
      - ANALYST_OLLAMA_MODEL=${ANALYST_OLLAMA_MODEL:-deepseek-r1}
      - ANALYST_TRADE_REVIEW_INTERVAL_HOURS=${ANALYST_TRADE_REVIEW_INTERVAL_HOURS:-4}
      - ANALYST_TRADE_LOOKBACK=${ANALYST_TRADE_LOOKBACK:-50}
      - TRADING_SYMBOLS=${TRADING_SYMBOLS:-ALL}
      - CRYPTO_REGIME_SYMBOL=${CRYPTO_REGIME_SYMBOL:-BTC/USD}
      - CRYPTO_BASE_EQUITY_USD=${CRYPTO_BASE_EQUITY_USD:-100000}
      # Per-process overrides (API_PORT, MARKET, DB_PATH, BACKEND_API_URL,
      # CRYPTO_BACKEND_API_URL) are set in deploy/supervisord.conf, not
      # here — all three processes now share one network namespace, so
      # they talk to each other over 127.0.0.1 instead of compose DNS.
    volumes:
      - db_data:/app/shared
    ports:
      - "${API_PORT:-8000}:8000"
      - "${CRYPTO_API_PORT:-8001}:8001"
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  db_data:
    driver: local
